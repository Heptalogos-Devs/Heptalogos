name: verify-manual

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional revision to verify; defaults to the dispatched commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: node scripts/package/sdk-inputs.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:native-sdk
      - run: pnpm verify --show-output
